<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.relative {
            position: absolute;
            top: 20px;
            right: 80px;
            width: 120p
        }

        div.relative {
            position: relative;
            width: 50%;
            height: 200px;
            border: 3px solid green;
            margin: auto;
        }

        div.absolute {
            position: absolute;
            top: 80px;
            right: 0;
            width: 200px;
            height: 100px;
            border: 3px solid red;
        }

        div.box1 {
            position: absolute;
            top: 20px;
            right: -80px;
            width: 120px;
            border: 3px solid red;
            background: pink;
        }

        div.box2 {
            position: absolute;
            bottom: 20px;
            left: -80px;
            width: 120px;
            border: 3px solid red;
        }
    </style>
</head>

<body>
    <div class="relative">
    </div>
    <div></div>

    <h2>Using position: absolute;</h2>

    <p>An element with position: absolute; is positioned relative to the nearest positioned ancestor:</p>

    <div class="relative">This div element has position: relative;
        <div class="box1">Yasssssss;</div>
        <div class="box2"> Queeeeen
        </div>

</body>

</html>
